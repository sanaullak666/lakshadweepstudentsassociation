<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Lakshadweep Students Association</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="icon" href="../images/logo.jpg">
</head>
<body style="background:linear-gradient(160deg, var(--lsa-light-bg) 0%, var(--lsa-light-blue) 50%, #E8EEFF 100%); display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem;">

  <div style="width:100%; max-width:440px;">
    
    <!-- BRAND HEADER -->
    <div style="text-align:center; margin-bottom:2rem;">
      <div style="margin:0 auto 1rem; text-align:center;">
        <img src="../images/logo.jpg" alt="LSA Logo" style="height:64px; width:auto; border-radius:12px; box-shadow:var(--lsa-shadow-md);">
      </div>
      <h2 style="color:var(--lsa-primary); font-size:1.75rem; margin-bottom:0.3rem;">LSA Admin Control Panel</h2>
      <p style="color:var(--lsa-text-secondary); font-size:0.9rem;">Sign in to access admin management dashboard</p>
    </div>

    <!-- LOGIN CARD -->
    <div style="background:var(--lsa-white); border-radius:var(--lsa-radius-xl); padding:2.5rem 2rem; box-shadow:var(--lsa-shadow-2xl); border:1px solid var(--lsa-border-light);">
      
      <form id="admin-login-form">
        <div class="form-group" style="margin-bottom:1.25rem;">
          <label for="login-email" class="form-label" style="font-weight:700; color:var(--lsa-primary);">Admin Email</label>
          <input type="email" id="login-email" class="form-control" placeholder="lakshadweepstudentsassociation@gmail.com" required style="font-weight:600;">
        </div>

        <div class="form-group" style="margin-bottom:1.75rem;">
          <label for="login-password" class="form-label" style="font-weight:700; color:var(--lsa-primary);">Password</label>
          <input type="password" id="login-password" class="form-control" placeholder="••••••••" required style="font-weight:600;">
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" id="btn-login-submit" style="font-weight:700;">
          Login to Dashboard →
        </button>
      </form>
    </div>

    <div style="text-align:center; margin-top:1.5rem;">
      <a href="../index.html" style="font-size:0.875rem; color:var(--lsa-text-secondary); font-weight:600;">← Back to Public Website</a>
    </div>

  </div>

  <script src="../js/main.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
